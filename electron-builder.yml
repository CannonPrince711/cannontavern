appId: com.dndtavern.app
productName: DND Tavern
copyright: Copyright © 2026 DND Tavern
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: extensions
    to: extensions
    filter: ['**/*']
  - from: resources/icon.png
    to: icon.png
npmRebuild: false
win:
  executableName: DND Tavern
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName} Setup ${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DND Tavern
  uninstallDisplayName: DND Tavern
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
portable:
  artifactName: ${productName} ${version}.${ext}
# In-app updates read latest.yml from GitHub Releases. "npm run release"
# (with GH_TOKEN set) uploads the installer, its blockmap and latest.yml.
publish:
  provider: github
  owner: CannonPrince711
  repo: cannontavern
  releaseType: release
